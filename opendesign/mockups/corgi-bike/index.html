<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ec">
  <title>今天，慢慢骑。— 柯基的兜风日</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f5ec;
      --ink: #494838;
      --muted: #92917e;
      --green: #54745b;
      --coral: #cb644d;
      --cycle: 2.4s;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .page { max-width: 1440px; margin: auto; padding: 0 64px; }
    .masthead {
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #deded0;
    }
    .brand { display: flex; gap: 13px; align-items: center; }
    .brand-mark { width: 37px; height: 37px; color: var(--green); }
    .brand-name { font-size: 16px; font-weight: 650; letter-spacing: 3px; }
    .brand-sub { margin-top: 5px; font-size: 9px; letter-spacing: 2.5px; color: var(--muted); }
    .edition { display: flex; align-items: center; gap: 22px; font-size: 11px; letter-spacing: 2px; color: #777a69; }
    .edition span + span { padding-left: 22px; border-left: 1px solid #d5d7c8; }
    .scene { position: relative; margin: 0 -24px; }
    .intro { position: absolute; z-index: 1; top: 12.6%; left: 2%; pointer-events: none; }
    .eyebrow { margin: 0 0 25px; color: var(--green); font-size: 10px; letter-spacing: 3px; font-weight: 600; }
    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
      font-size: clamp(48px, 5.3vw, 76px);
      font-weight: 600;
      line-height: 1.24;
      letter-spacing: 3px;
    }
    h1 .accent { color: var(--green); position: relative; }
    .title-underline { display: block; width: 176px; height: 12px; margin: 9px 0 0 5px; color: #c1cba9; }
    .description { margin: 24px 0 0; color: #898875; font-size: 13px; line-height: 2; letter-spacing: 1.5px; }
    .art { display: block; width: 100%; overflow: visible; }
    .closing {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
      padding: 5px 0 32px;
    }
    .caption { display: flex; gap: 15px; align-items: center; color: #848674; font-size: 11px; letter-spacing: 2px; }
    .caption-line { width: 37px; height: 1px; background: #9ea98b; }
    .controls { display: flex; align-items: center; gap: 23px; }
    .ride-status { color: #7f856e; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1px; }
    .status-dot { width: 5px; height: 5px; background: #729365; border-radius: 50%; }
    .pause-button {
      min-height: 45px;
      min-width: 122px;
      padding: 0 18px;
      border: 1px solid #c7cbb6;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #5c6c50;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
      transition: background 180ms ease, border-color 180ms ease;
    }
    .pause-button:hover { background: #e9eddf; border-color: #91a181; }
    .pause-button:focus-visible { outline: 2px solid var(--green); outline-offset: 5px; }
    .pause-button svg { width: 13px; height: 13px; }
    .play-icon { display: none; }
    [data-paused="true"] .pause-icon { display: none; }
    [data-paused="true"] .play-icon { display: block; }
    [data-paused="true"] .status-dot { background: #b99a61; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: wheel-turn 1.2s linear infinite; }
    .cloud { animation: cloud-drift 9s ease-in-out infinite alternate; }
    .cloud-far { animation-duration: 14s; animation-direction: alternate-reverse; }
    .scarf-tail { transform-origin: 749px 318px; animation: scarf-flutter 1.2s ease-in-out infinite alternate; }
    .ear-tip { transform-origin: 821px 279px; animation: happy-bob var(--cycle) ease-in-out infinite; }
    .tail { transform-origin: 601px 337px; animation: tail-wag 0.8s ease-in-out infinite alternate; }
    .road-dashes { animation: road-move var(--cycle) linear infinite; }
    .breeze { animation: breeze 3s ease-in-out infinite; }
    .breeze.second { animation-delay: -1.5s; }
    [data-paused="true"] .art * { animation-play-state: paused !important; }
    @keyframes wheel-turn { to { transform: rotate(360deg); } }
    @keyframes cloud-drift { to { transform: translateX(17px); } }
    @keyframes scarf-flutter { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes happy-bob { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
    @keyframes tail-wag { from { transform: rotate(-7deg); } to { transform: rotate(8deg); } }
    @keyframes road-move { to { transform: translateX(-120px); } }
    @keyframes breeze { 0%, 100% { opacity: 0.25; transform: translateX(8px); } 50% { opacity: 0.8; transform: translateX(-8px); } }
    @media (min-width: 1600px) { .page { padding-top: 22px; } }
    @media (max-width: 900px) {
      .page { padding: 0 32px; }
      .masthead { height: 88px; }
      .scene { margin: 0 -20px; }
      .intro { top: 9%; left: 3%; }
      .eyebrow { font-size: 9px; margin-bottom: 18px; letter-spacing: 2px; }
      h1 { font-size: 48px; }
      .description { font-size: 11px; margin-top: 15px; }
      .title-underline { width: 140px; }
      .closing { padding-top: 20px; }
      .caption { font-size: 10px; letter-spacing: 1px; }
      .edition { gap: 14px; font-size: 9px; }
      .edition span + span { padding-left: 14px; }
    }
    @media (max-width: 640px) {
      .page { padding: 0 24px; overflow: hidden; }
      .masthead { height: 84px; }
      .brand-mark { width: 30px; height: 30px; }
      .brand { gap: 9px; }
      .brand-name { font-size: 13px; letter-spacing: 2px; }
      .brand-sub { font-size: 7px; letter-spacing: 1.7px; }
      .edition span:first-child { display: none; }
      .edition span + span { border: 0; padding: 0; }
      .scene { margin: 0 -24px; padding-top: 254px; }
      .intro { top: 38px; left: 28px; }
      .eyebrow { margin-bottom: 16px; }
      h1 { font-size: clamp(36px, 10.7vw, 50px); line-height: 1.18; letter-spacing: 2px; }
      h1 br { display: none; }
      .title-underline { width: 135px; margin-left: clamp(110px, 32vw, 148px); }
      .description { font-size: 12px; margin-top: 15px; line-height: 1.8; }
      .art { width: 178%; max-width: none; margin-left: -65%; margin-top: -14px; }
      .closing { padding: 0 0 28px; flex-wrap: wrap; gap: 24px; }
      .caption { width: 100%; justify-content: center; font-size: 10px; }
      .caption-line { width: 22px; }
      .controls { width: 100%; justify-content: center; gap: 26px; }
    }
    @media (max-width: 365px) { .edition { letter-spacing: 1px; } }
    @media (prefers-reduced-motion: reduce) {
      .art * { animation: none !important; }
      .pause-button { transition: none; }
    }
  </style>
</head>

          <!-- Small roadside details and moving marks beneath the wheels. -->
          <g clip-path="url(#road-clip)" stroke="#c1c6ae" stroke-width="2" stroke-linecap="round">
            <g class="road-dashes"><path d="M348 665H369M411 665H417M468 665H489M531 665H537M588 665H609M651 665H657M708 665H729M771 665H777M828 665H849M891 665H897M948 665H969M1011 665H1017M1068 665H1089M1131 665H1137"></path></g>
          </g>
          <g transform="translate(188 613)"><use href="#daisy"></use></g>
          <g transform="translate(216 627) scale(.72)"><use href="#daisy"></use></g>
          <path d="M183 651Q174 634 166 638M197 650Q201 635 209 637" stroke="#91a47b" stroke-width="2.5" stroke-linecap="round"></path>
          <g transform="translate(1102 624) scale(.8)"><use href="#daisy"></use></g>
          <path d="M1080 651Q1087 631 1078 623M1084 640Q1069 638 1071 631Q1080 629 1084 640M1124 651 1132 638M1130 650 1142 646" stroke="#91a47b" stroke-width="2.5" stroke-linecap="round"></path>
          <path d="M297 655Q303 648 310 653Q316 648 322 655M104 652H117M1165 659H1185" stroke="#c0c5ad" stroke-width="2" stroke-linecap="round"></path>
          <g transform="translate(1067 357) rotate(-18)">
            <path d="M0 0C-19-23-27 2-5 6C-20 15-2 25 2 9C19 21 28 5 8 3C25-9 8-21 0 0Z" fill="#dbb87c"></path>
            <path d="M1 0 4 10" stroke="#8f7c51" stroke-width="2" stroke-linecap="round"></path>
          </g>
          <path d="M1088 379Q1119 408 1135 382Q1147 363 1162 380" stroke="#c8c4a7" stroke-width="1.5" stroke-dasharray="3 6" stroke-linecap="round"></path>
        </svg>
      </section>

      <footer class="closing">
        <div class="caption"><span class="caption-line"></span>腿短短，路长长。快乐慢慢来。</div>
        <div class="controls">
          <span class="ride-status"><span class="status-dot"></span><span id="status-text">快乐骑行中</span></span>
          <button class="pause-button" id="pause-button" type="button" aria-pressed="false" aria-label="暂停骑行动画">
            <svg class="pause-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="2.5" height="10" rx="1"></rect><rect x="9.5" y="3" width="2.5" height="10" rx="1"></rect></svg>
            <svg class="play-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3.4Q4 2.5 5 3L13 7.3Q14 8 13 8.7L5 13Q4 13.5 4 12.6Z"></path></svg>
            <span id="button-text">歇一会儿</span>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <script>
    // The paws and pedals share one position, so they stay together throughout the ride.
    const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
    const pauseButton = document.getElementById("pause-button");
    const statusText = document.getElementById("status-text");
    const buttonText = document.getElementById("button-text");
    const legs = Object.fromEntries(["near", "far"].map(side => [side, {
      outline: document.getElementById(`${side}-leg-outline`),
      leg: document.getElementById(`${side}-leg`),
      sock: document.getElementById(`${side}-sock`),
      crank: document.getElementById(`${side}-crank`),
      pedal: document.getElementById(`${side}-pedal`)
    }]));
    let paused = motionPreference.matches;
    let elapsed = 0;
    let previousTime = null;
    let animationFrame = null;

    function drawLeg(side, angle) {
      const nodes = legs[side];
      const x = 699 + Math.cos(angle) * 30;
      const y = 535 + Math.sin(angle) * 30;
      const near = side === "near";
      const hip = near ? { x: 650, y: 397 } : { x: 697, y: 405 };
      const knee = near
        ? { x: 657 + Math.cos(angle) * 12, y: 462 + Math.sin(angle) * 9 }
        : { x: 737 + Math.cos(angle) * 10, y: 463 + Math.sin(angle) * 9 };
      const shin = { x: knee.x + (x - knee.x) * 0.65, y: knee.y + (y - knee.y) * 0.65 };
      const path = `M${hip.x} ${hip.y}Q${knee.x - 14} ${knee.y - 20} ${knee.x} ${knee.y}L${x} ${y}`;
      nodes.outline.setAttribute("d", path);
      nodes.leg.setAttribute("d", path);
      nodes.sock.setAttribute("d", `M${shin.x} ${shin.y}L${x} ${y}`);
      nodes.crank.setAttribute("d", `M699 535L${x} ${y}`);
      nodes.pedal.setAttribute("transform", `translate(${x} ${y})`);
    }

    function drawPedals() {
      const angle = elapsed / 2400 * Math.PI * 2 - 0.5;
      drawLeg("far", angle + Math.PI);
      drawLeg("near", angle);
    }

    function tick(time) {
      if (previousTime !== null) elapsed += Math.min(time - previousTime, 80);
      previousTime = time;
      drawPedals();
      animationFrame = requestAnimationFrame(tick);
    }

    function setPaused(value) {
      paused = value;
      document.body.dataset.paused = String(paused);
      pauseButton.setAttribute("aria-pressed", String(paused));
      pauseButton.setAttribute("aria-label", paused ? "继续骑行动画" : "暂停骑行动画");
      statusText.textContent = paused ? "停下来，看看风景" : "快乐骑行中";
      buttonText.textContent = paused ? "继续兜风" : "歇一会儿";
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      previousTime = null;
      if (!paused && !document.hidden) animationFrame = requestAnimationFrame(tick);
    }

    pauseButton.addEventListener("click", () => setPaused(!paused));
    motionPreference.addEventListener("change", event => setPaused(event.matches));
    document.addEventListener("visibilitychange", () => setPaused(paused));
    drawPedals();
    setPaused(paused);
  </script>
</body>
</html>
